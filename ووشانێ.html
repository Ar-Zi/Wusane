<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;background:#151a1c;font-family:Tahoma,Arial,sans-serif}
#sg41{--bg:#151a1c;--panel:#202729;--inside:#303638;--line:#4b575b;--text:#f5f0e7;--gold:#e9a923;--green:#35825a;--purple:#735e88;--red:#a34a43;width:min(100%,960px);margin:auto;padding:9px;border:1px solid #3d4649;border-radius:20px;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;box-sizing:border-box}
#sg41 *{box-sizing:border-box}
.players{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.panel{min-width:0;padding:8px;border:2px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.player{height:210px;display:flex;flex-direction:column}
.active{border-color:var(--gold);box-shadow:0 0 0 2px #e9a92325}
.panel h3{margin:0 0 6px;font-size:.86rem}
.writing{flex:1;min-height:0;padding:8px;overflow:auto;border-radius:8px;background:var(--inside);font-size:1.08rem;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.bottom{display:grid;grid-template-columns:1fr 1.08fr;gap:7px;margin-top:7px;direction:rtl}
.controls,.info{min-width:0;min-height:150px;padding:8px;border:2px solid var(--line);border-radius:14px;background:var(--panel)}
.controls{direction:ltr;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;align-items:center}
.dieWrap{display:flex;min-width:0;justify-content:center}
.die{width:min(72px,100%);aspect-ratio:1;display:grid;place-items:center;border:4px solid var(--text);border-radius:19px;background:#293133;box-shadow:0 5px 0 #101415;font-size:2.3rem;font-weight:900}
.buttons{display:grid;gap:3px;direction:rtl}
.btn{min-height:40px;border:0;border-radius:7px;color:#fff;font-weight:800;font-size:.8rem;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4}.new{background:var(--green)}.undo{background:var(--purple)}.roll{background:var(--gold);color:#2b220f}.end{background:var(--red)}
.info{direction:rtl;display:flex;flex-direction:column;justify-content:center;gap:7px;text-align:center}
.title{font-size:.91rem;font-weight:900}
.scores{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.score{padding:4px 6px;border:1px solid var(--line);border-radius:99px;background:#293133;font-size:.72rem;font-weight:800}
.status{padding:6px;border-radius:8px;background:var(--inside);font-size:.75rem;font-weight:800;line-height:1.4}
.keysPanel{margin-top:7px;padding:4px}
.keys{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:44px;gap:3px}
.key{width:100%;height:100%;min-width:0;padding:0;border:1px solid #5b6669;border-radius:4px;background:#2c3335;color:var(--text);font-size:1rem;font-weight:900;cursor:pointer;touch-action:manipulation}
.key:disabled{opacity:.4;cursor:not-allowed}.key:focus-visible,.key:hover:not(:disabled){outline:2px solid #57a8b5}
.keys>.key:nth-last-child(-n+4){grid-column:span 2}
.spaceKey{background:#244148;font-size:.8rem}
.message{min-height:19px;padding-top:5px;text-align:center;color:#f2b7ae;font-size:.76rem}
.spaceMark{display:inline-block;width:1em;height:.65em;border-bottom:3px dotted var(--gold);vertical-align:middle}
.pending{animation:p 1s infinite}@keyframes p{50%{opacity:.2}}
@media(min-width:580px){
  #sg41{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;gap:7px}
  .players{grid-column:1;grid-row:1/3}
  .player{height:100%;min-height:0}
  .bottom{grid-column:2;grid-row:1;margin:0}
  .keysPanel{grid-column:2;grid-row:2;margin:0}
  .message{grid-column:1/-1;grid-row:3}
}
@media(max-width:340px){
  #sg41{padding:6px}
  .controls,.info{padding:6px}
  .controls{grid-template-columns:minmax(0,1fr) 64px;gap:3px}
  .die{width:min(50px,100%);font-size:1.8rem}
  .btn{font-size:.74rem}
  .score,.status{font-size:.68rem}
}
</style>
</head>
<body>
<div id="sg41" dir="rtl">
<div class="players"><section id="hp" class="panel player active"><h3>مرۆڤ</h3><div id="hw" class="writing"></div></section><section id="cp" class="panel player"><h3>کۆمپیوتەر</h3><div id="cw" class="writing"></div></section></div>
<div class="bottom"><section class="controls" aria-label="کۆنترۆڵی یاری"><div class="dieWrap"><div id="die" class="die" aria-label="ئەنجامی زار">؟</div></div><div class="buttons"><button type="button" id="new" class="btn new">نوێ</button><button type="button" id="undo" class="btn undo" disabled>دووبارە</button><button type="button" id="roll" class="btn roll">زار</button><button type="button" id="end" class="btn end" disabled>تەواو</button></div></section><aside class="info"><div class="title">ووشانێ</div><div class="scores"><span class="score">مرۆڤ: <b id="hs">0</b>/50</span><span class="score">کۆمپیوتەر: <b id="cs">0</b>/50</span></div><div id="status" class="status" aria-live="polite">نۆرەتە؛ زارەکە هەڵدە.</div></aside></div>
<section class="panel keysPanel"><div id="keys" class="keys"></div></section><div id="msg" class="message" aria-live="polite"></div>
<script src="wordlist.js"></script>
<script>
(()=>{
  const r=document.getElementById('sg41');
  if(r.dataset.ready)return;
  r.dataset.ready='1';
  const A=['ئـ','ا','ب','پ','ت','ج','چ','ح','خ','د','ر','ڕ','ز','ژ','س','ش','ع','غ','ف','ڤ','ق','ک','گ','ل','ڵ','م','ن','و','ۆ','ه','ە','ی','ێ'],P=['.',',','!','؟',';',':','"',"'",'-','…'];
  const $=x=>r.querySelector(x),e={keys:$('#keys'),hw:$('#hw'),cw:$('#cw'),hs:$('#hs'),cs:$('#cs'),hp:$('#hp'),cp:$('#cp'),die:$('#die'),status:$('#status'),msg:$('#msg'),n:$('#new'),u:$('#undo'),ro:$('#roll'),en:$('#end')};
  const words=window.WUSANE_WORDS;
  if(!Array.isArray(words)||!words.length){
    e.ro.disabled=true;
    e.status.textContent='لیستی ووشەکان کێشەی هەیە.';
    console.error('The word list could not be loaded or is empty.');
    return;
  }
  let s,timer,timeout;
  const kn=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
  function output(el,a,p){
    el.replaceChildren();
    a.forEach((x,i)=>{
      if(x===' '){
        const z=document.createElement('span');
        z.className='spaceMark'+(p&&i===a.length-1?' pending':'');
        z.title='بۆشایی';
        el.append(z);
      }else el.append(document.createTextNode(x));
    });
    el.scrollTop=el.scrollHeight;
  }
  function draw(){
    e.hs.textContent=s.h.length;e.cs.textContent=s.c.length;
    output(e.hw,s.h,s.turn==='h');output(e.cw,s.c,false);
    e.hp.classList.toggle('active',s.turn==='h'&&!s.over);e.cp.classList.toggle('active',s.turn==='c'&&!s.over);
    const can=s.turn==='h'&&s.rolled&&s.used<s.max&&!s.over;
    e.keys.querySelectorAll('button').forEach(b=>b.disabled=!can);
    e.ro.disabled=s.turn!=='h'||s.rolled||s.over;e.en.disabled=s.turn!=='h'||!s.rolled||s.over;e.u.disabled=s.turn!=='h'||!s.used||s.over;
    if(!s.over)e.status.textContent=s.turn==='c'?' کۆمپیوتەر…':s.rolled?'نۆرەتە؛'+kn(s.max-s.used)+' هەڵبژاردنت ماوە.':'نۆرەتە؛ زارەکە هەڵدە.';
  }
  function reset(){
    clearInterval(timer);clearTimeout(timeout);
    s={h:[],c:[],turn:'h',rolled:false,max:0,used:0,over:false,queue:[],sentenceWords:0,sentenceTarget:3+Math.floor(Math.random()*3)};
    e.die.textContent='؟';e.msg.textContent='';draw();
  }
  function win(w){
    if(s[w].length<50)return false;
    s.over=true;e.status.textContent='گەمەکە تەواو بوو.';
    e.msg.textContent=w==='h'?'پیرۆزە! مرۆڤ بردییەوە.':'کۆمپیوتەر بردییەوە.';
    draw();return true;
  }
  function pick(x){
    if(s.turn!=='h'||!s.rolled||s.used>=s.max||s.over)return;
    s.h.push(x);s.used++;e.msg.textContent=x===' '?'بۆشایی هەڵبژێردرا.':'';
    if(!win('h'))draw();
  }
  function nextComputerCharacter(){
    if(!s.queue.length){
      const word=words[Math.floor(Math.random()*words.length)];
      s.sentenceWords++;
      let suffix=' ';
      if(s.sentenceWords===s.sentenceTarget){
        const endings=['.','!','؟'];
        suffix=endings[Math.floor(Math.random()*endings.length)]+' ';
        s.sentenceWords=0;s.sentenceTarget=3+Math.floor(Math.random()*3);
      }
      s.queue=Array.from(word+suffix);
    }
    return s.queue.shift();
  }
  function computer(){
    if(s.over)return;
    const d=1+Math.floor(Math.random()*6);
    let i=0;e.die.textContent=kn(d);
    timer=setInterval(()=>{
      if(s.over){clearInterval(timer);return}
      s.c.push(nextComputerCharacter());i++;draw();
      if(win('c')){clearInterval(timer);return}
      if(i===d){
        clearInterval(timer);
        timeout=setTimeout(()=>{s.turn='h';s.rolled=false;s.max=s.used=0;e.die.textContent='؟';draw()},280);
      }
    },130);
  }
  [...A,...P].forEach(x=>{
    const b=document.createElement('button');b.type='button';b.className='key';b.textContent=x;b.setAttribute('aria-label',x);
    b.addEventListener('click',()=>pick(x));e.keys.append(b);
  });
  const sp=document.createElement('button');sp.type='button';sp.className='key spaceKey';sp.textContent='SP';sp.title='بۆشایی';sp.setAttribute('aria-label','بۆشایی');
  sp.addEventListener('click',()=>pick(' '));e.keys.append(sp);
  e.n.addEventListener('click',reset);
  e.ro.addEventListener('click',()=>{if(s.rolled||s.turn!=='h'||s.over)return;s.max=1+Math.floor(Math.random()*6);s.used=0;s.rolled=true;e.die.textContent=kn(s.max);draw()});
  e.u.addEventListener('click',()=>{if(!s.used||s.turn!=='h'||s.over)return;s.h.pop();s.used--;draw()});
  e.en.addEventListener('click',()=>{if(!s.rolled||s.turn!=='h'||s.over)return;s.turn='c';s.rolled=false;s.used=s.max=0;draw();timeout=setTimeout(computer,280)});
  reset();
})();
</script>
</div>
</body>
</html>
